[package]
name = "remoteid-spoof-benchmark"
version = "0.1.0"
authors = ["Matt Busel <matt@busel.dev>"]
edition = "2021"
rust-version = "1.70"
description = "The public Remote ID spoof and flood detection benchmark: a standardized synthetic test corpus with ground truth, plus a scoring harness, so any counter-UAS detector can prove whether it catches spoofed and flooded broadcasts. Test data only, no radio and no transmit path."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Mattbusel/remoteid-spoof-benchmark"
keywords = ["remote-id", "drone", "counter-uas", "benchmark", "spoofing"]
categories = ["aerospace::drones", "development-tools::testing"]
publish = false

[dependencies]
remoteid = { version = "0.3.3", default-features = false, features = ["std", "serde"] }
remoteid-scenario = "0.1.0"
remoteid-sentinel = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "generate-corpus"
path = "src/bin/generate-corpus.rs"

[[bin]]
name = "baseline-sentinel"
path = "src/bin/baseline-sentinel.rs"
